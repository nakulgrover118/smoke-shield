<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16323d"/>
      <stop offset="0.45" stop-color="#7a5a4a"/>
      <stop offset="0.8" stop-color="#e59a52"/>
      <stop offset="1" stop-color="#f6c56e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="blurS" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="1200" height="675" fill="url(#sky)"/>

  <!-- sun haze -->
  <circle cx="930" cy="470" r="220" fill="url(#glow)" opacity="0.55"/>

  <!-- smoke plumes drifting from the fires toward the city -->
  <g filter="url(#blur)" fill="#3b3430">
    <ellipse cx="230" cy="470" rx="70" ry="48" opacity="0.55"/>
    <ellipse cx="330" cy="420" rx="95" ry="58" opacity="0.5"/>
    <ellipse cx="450" cy="372" rx="120" ry="66" opacity="0.46"/>
    <ellipse cx="590" cy="330" rx="145" ry="74" opacity="0.42"/>
    <ellipse cx="740" cy="300" rx="170" ry="80" opacity="0.38"/>
    <ellipse cx="900" cy="290" rx="190" ry="84" opacity="0.34"/>
    <ellipse cx="1060" cy="300" rx="190" ry="84" opacity="0.30"/>
  </g>
  <g filter="url(#blurS)" fill="#5a4c44">
    <ellipse cx="300" cy="450" rx="60" ry="30" opacity="0.5"/>
    <ellipse cx="520" cy="360" rx="90" ry="36" opacity="0.4"/>
    <ellipse cx="760" cy="318" rx="110" ry="38" opacity="0.35"/>
  </g>

  <!-- wind direction arrows -->
  <g stroke="#fff3df" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75">
    <path d="M250 200 L420 200"/><path d="M400 188 L424 200 L400 212"/>
    <path d="M380 150 L590 150"/><path d="M570 138 L594 150 L570 162"/>
    <path d="M540 220 L720 220"/><path d="M700 208 L724 220 L700 232"/>
  </g>

  <!-- ground -->
  <rect y="560" width="1200" height="115" fill="#1b1613"/>

  <!-- crop-field fires on the left -->
  <g>
    <ellipse cx="130" cy="552" rx="46" ry="26" fill="url(#glow)"/>
    <ellipse cx="250" cy="556" rx="40" ry="22" fill="url(#glow)"/>
    <ellipse cx="360" cy="554" rx="34" ry="20" fill="url(#glow)"/>
    <path d="M118 560 C112 538 126 532 126 516 C138 530 148 544 142 560 Z" fill="#ff7a2e"/>
    <path d="M124 560 C122 546 130 542 131 532 C138 542 142 550 138 560 Z" fill="#ffd36e"/>
    <path d="M238 560 C233 542 244 538 244 524 C254 536 262 548 257 560 Z" fill="#ff7a2e"/>
    <path d="M244 560 C242 548 249 545 250 536 C256 545 259 552 255 560 Z" fill="#ffd36e"/>
    <path d="M350 560 C346 546 354 543 354 532 C362 541 367 550 363 560 Z" fill="#ff7a2e"/>
  </g>
  <!-- field furrows -->
  <g stroke="#2b221c" stroke-width="3" opacity="0.9">
    <path d="M0 585 L520 585"/><path d="M0 610 L520 610"/><path d="M0 636 L520 636"/><path d="M0 662 L520 662"/>
  </g>

  <!-- city skyline silhouette on the right -->
  <g fill="#120f0d">
    <rect x="640" y="470" width="46" height="90"/>
    <rect x="696" y="440" width="38" height="120"/>
    <rect x="744" y="486" width="50" height="74"/>
    <rect x="1040" y="452" width="44" height="108"/>
    <rect x="1094" y="480" width="52" height="80"/>
    <rect x="1156" y="436" width="44" height="124"/>
  </g>

  <!-- the school -->
  <g>
    <rect x="820" y="470" width="190" height="90" fill="#120f0d"/>
    <path d="M810 470 L915 418 L1020 470 Z" fill="#120f0d"/>
    <rect x="905" y="372" width="5" height="50" fill="#120f0d"/>
    <path d="M910 374 L944 384 L910 396 Z" fill="#2fa6a0"/>
    <g fill="#f6c56e" opacity="0.9">
      <rect x="836" y="490" width="22" height="26"/><rect x="872" y="490" width="22" height="26"/>
      <rect x="936" y="490" width="22" height="26"/><rect x="972" y="490" width="22" height="26"/>
    </g>
    <rect x="903" y="520" width="24" height="40" fill="#2fa6a0"/>
  </g>

  <!-- shield over the school -->
  <g transform="translate(915 318)">
    <path d="M0 -58 C22 -50 42 -46 56 -46 C56 -4 38 34 0 58 C-38 34 -56 -4 -56 -46 C-42 -46 -22 -50 0 -58 Z"
          fill="#e6f6f4" fill-opacity="0.18" stroke="#8fe0d8" stroke-width="5"/>
    <circle cx="0" cy="-2" r="14" fill="#8fe0d8" fill-opacity="0.85"/>
  </g>
</svg>
